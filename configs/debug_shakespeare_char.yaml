# Run: python data/prepare_shakespeare_char.py
#      python train.py --config configs/debug_shakespeare_char.yaml

out_dir: out/debug_shakespeare_char
data_dir: data/shakespeare_char

wandb_log: false
wandb_run_name: debug_shakespeare_char

batch_size: 64
block_size: 256
grad_accum_steps: 1

n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.2
bias: false

learning_rate: 1.0e-3
max_iters: 200
weight_decay: 0.1
warmup_iters: 20
lr_decay_iters: 200
min_lr: 1.0e-4
grad_clip: 1.0

eval_interval: 50
eval_iters: 20
log_interval: 10
sample_every: 100
always_save_checkpoint: false

device: cpu
dtype: float32
compile: false
