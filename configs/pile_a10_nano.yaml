

out_dir: out/pile_a10_nano
data_dir: data/pile

wandb_log: false
wandb_run_name: pile_a10_nano

batch_size: 32
block_size: 1024
grad_accum_steps: 8

n_layer: 8
n_head: 8
n_embd: 512
dropout: 0.0
bias: false

learning_rate: 6.0e-4
max_iters: 8000
weight_decay: 0.1
warmup_iters: 200
lr_decay_iters: 8000
min_lr: 6.0e-5
grad_clip: 1.0

eval_interval: 250
eval_iters: 50
log_interval: 10
sample_every: 500
always_save_checkpoint: false

device: cuda
dtype: bfloat16
compile: true
