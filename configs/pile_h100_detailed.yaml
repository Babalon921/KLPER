

out_dir: out/pile_h100_detailed
data_dir: data/pile_6b

wandb_log: false
wandb_run_name: pile_h100_detailed

batch_size: 32
block_size: 1024
grad_accum_steps: 16

n_layer: 20
n_head: 16
n_embd: 1024
dropout: 0.0
bias: false

learning_rate: 3.0e-4
max_iters: 12000
weight_decay: 0.1
warmup_iters: 300
lr_decay_iters: 12000
min_lr: 3.0e-5
grad_clip: 1.0

eval_interval: 250
eval_iters: 50
log_interval: 10
sample_every: 500
always_save_checkpoint: false

device: cuda
dtype: bfloat16
compile: true
